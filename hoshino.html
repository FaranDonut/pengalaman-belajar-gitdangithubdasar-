<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshino's Room 🌙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d1b3e 0%, #1a2f6b 50%, #0d1b3e 100%);
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d) ease-in-out infinite var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.9; }
        }

        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8%;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: #aac4e8;
            text-decoration: none;
            margin-left: 24px;
            font-size: 15px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            position: relative;
            z-index: 1;
            min-height: 78vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .moon {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 40% 40%, #fffde0, #f5d96e);
            border-radius: 50%;
            top: 50px;
            right: 10%;
            box-shadow: 0 0 60px 20px rgba(255, 240, 150, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 640px;
        }

        .content h1 {
            font-size: 68px;
            margin-bottom: 14px;
        }

        .content h2 {
            font-size: 22px;
            font-weight: normal;
            color: #b8d4f0;
            margin-bottom: 18px;
        }

        .content p {
            color: #d0dff5;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .btn {
            padding: 13px 30px;
            border-radius: 30px;
            border: none;
            background: #7ec8f0;
            color: #0d1b3e;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 24px rgba(126, 200, 240, 0.6);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 640px;
            margin: 0 auto 60px;
            padding: 36px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 14px;
            font-size: 22px;
        }

        .card p {
            color: #c0d4ef;
            line-height: 1.7;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 24px;
            color: #8aaacf;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .content h1 { font-size: 44px; }
            .moon { width: 110px; height: 110px; right: 5%; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <nav>
        <div class="logo">🌙 HOSHINO</div>
        <div>
            <a href="javascript:void(0)">Home</a>
            <a href="javascript:void(0)">About</a>
        </div>
    </nav>

    <section class="hero">
        <div class="moon"></div>
        <div class="content">
            <h1>Hoshino 🌙</h1>
            <h2>Welcome to my little corner of the night sky.</h2>
            <p>A simple website made with HTML, CSS, and JavaScript.<br>Sit back, relax, and enjoy the stars.</p>
            <button class="btn" onclick="sayHello()">Click Me ✨</button>
        </div>
    </section>

    <div class="card">
        <h2>About This Website</h2>
        <p>Website ini dibuat sebagai latihan pertama menggunakan HTML, CSS, dan JavaScript.</p>
    </div>

    <footer>Made with 🌙 &amp; ✨</footer>

    <script>
        function sayHello() {
            alert("Oji-san~! 🌙✨");
        }

        const container = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 0.5;
            s.style.cssText = `
                width: ${size}px; height: ${size}px;
                top: ${Math.random() * 100}%;
                left: ${Math.random() * 100}%;
                --d: ${(Math.random() * 3 + 2).toFixed(1)}s;
                --delay: -${(Math.random() * 5).toFixed(1)}s;
            `;
            container.appendChild(s);
        }
    </script>

</body>
</html>
